{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4 shadow p-4 bg-white rounded">
    {% if error_message_delete %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error_message_delete }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <h4>Confirm Delete</h4>
    <p>Are you sure you want to delete the Attendance?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-check-circle"></i> Yes, Delete</button>
        <a href="{% url 'attendance_index' %}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left-circle"></i> Cancel</a>
    </form>
</div>
{% endblock %}
