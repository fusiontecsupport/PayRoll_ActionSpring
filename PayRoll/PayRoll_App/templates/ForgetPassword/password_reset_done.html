<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Reset Sent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
    }
    .notification-box {
      background-color: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
    }
    .notification-title {
      font-weight: 700;
      color: #333;
    }
    .notification-text {
      font-size: 0.95rem;
      color: #666;
    }
    .btn-login {
      background-color: #0072ff;
      color: white;
      border: none;
    }
    .btn-login:hover {
      background-color: #005fcc;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="notification-box text-center">
      <h3 class="notification-title mb-3">Password Reset Sent</h3>
      <p class="notification-text mb-4">
        If an account with that email exists, a password reset link has been sent.
        Please check your inbox.
      </p>
      <a href="{% url 'login' %}" class="btn btn-login w-100">Back to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
