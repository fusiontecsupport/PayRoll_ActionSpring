<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Reset Complete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
    }
    .reset-complete-box {
      background-color: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
    }
    .reset-title {
      font-weight: 700;
      color: #333;
    }
    .btn-login {
      background-color: #0072ff;
      border: none;
    }
    .btn-login:hover {
      background-color: #005bd3;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="reset-complete-box text-center">
      <h3 class="reset-title mb-3">Password Reset Successful</h3>
      <p class="text-muted mb-4">
        Your password has been successfully changed. You can now log in with your new credentials.
      </p>
      <a href="{% url 'login' %}" class="btn btn-login text-white w-100">Login Now</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
