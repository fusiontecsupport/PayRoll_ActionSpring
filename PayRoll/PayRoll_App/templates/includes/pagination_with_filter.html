<form method="get" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4">
    <div class="input-group" style="width: 150px;">
        <label class="input-group-text" for="per_page">Show</label>
        <select name="per_page" id="per_page" class="form-select form-select-sm" onchange="this.form.submit()">
            <option value="10" {% if per_page|default:10 == 10 %}selected{% endif %}>10</option>
            <option value="20" {% if per_page == 20 %}selected{% endif %}>20</option>
            <option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
            <option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
        </select>
    </div>

    <nav aria-label="Pagination">
        <ul class="pagination justify-content-center pagination-sm mb-0">

            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?page=1&per_page={{ per_page }}{{ query_string }}">First</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="?page={{ page_obj.previous_page_number }}&per_page={{ per_page }}{{ query_string }}">Previous</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">First</span></li>
                <li class="page-item disabled"><span class="page-link">Previous</span></li>
            {% endif %}

            <li class="page-item disabled">
                <span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
            </li>

            {% if page_obj.has_next %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ page_obj.next_page_number }}&per_page={{ per_page }}{{ query_string }}">Next</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="?page={{ page_obj.paginator.num_pages }}&per_page={{ per_page }}{{ query_string }}">Last</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">Next</span></li>
                <li class="page-item disabled"><span class="page-link">Last</span></li>
            {% endif %}

        </ul>
    </nav>
</form>
