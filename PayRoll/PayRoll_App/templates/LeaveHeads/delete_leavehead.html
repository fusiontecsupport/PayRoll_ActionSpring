{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-4 shadow p-4 bg-white rounded">
    <h4>Confirm Delete</h4>
    <p>Are you sure you want to delete <strong>{{ object.LHMDESC }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-check-circle"></i> Yes, Delete</button>
        <a href="{% url 'leavehead_index' %}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left-circle"></i> Cancel</a>
    </form>
</div>
{% endblock %}
