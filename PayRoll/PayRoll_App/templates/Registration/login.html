{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payroll</title>
    
    <link href="{% static 'images/payroll.png' %}" rel="icon">
    <link href="{% static 'images/payroll.png' %}" rel="apple-touch-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .login-container {
            max-width: 480px;
        }

        .logo-img {
            max-height: 80px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center bg-light" style="min-height: 100vh;">
    <div class="container login-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mt-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        <script>
            // Auto-dismiss Bootstrap alerts after 3 seconds
            setTimeout(function () {
                const alerts = document.querySelectorAll('.alert');
                alerts.forEach(function(alert) {
                    // Use Bootstrap's alert "close" method
                    const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                    bsAlert.close();
                });
            }, 3000); // 3000ms = 3 seconds
        </script>

        <form method="post" class="shadow p-4 rounded bg-white">
            {% csrf_token %}
            <div class="text-center mb-4">
                <img src="{% static 'images/payroll.png' %}" alt="Logo" class="logo-img">
            </div>

            <label for="username" class="form-label">Username <span style="color: red;">*</span></label><br>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter Username" required><br>
    
            <label for="password" class="form-label">Password <span style="color: red;">*</span></label><br>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter Password" required><br>
    
            <label for="LDATE" class="form-label">Date</label><br>
            <input type="date" name="LDATE" id="LDATE" class="form-control" required><br>

            <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot Password?</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('LDATE').value = today;
            });
            
        window.onload = function () {
            const form = document.querySelector('form');
            const messages = document.querySelector('.messages');
            if (messages && form) {
                form.classList.add('shake');
                form.addEventListener('animationend', () => form.classList.remove('shake'));
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
